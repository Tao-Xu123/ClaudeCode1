<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1140" viewBox="0 0 1300 1140" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="white"/>
<style>.w{stroke:#000;stroke-width:2;fill:none}.r{stroke:#d00;stroke-width:2.5;fill:none;stroke-dasharray:8 5}.t{font-size:16px;fill:#000}.b{font-size:18px;font-weight:bold}.s{font-size:14px;fill:#333}.h{font-size:22px;font-weight:bold;text-decoration:underline}.box{stroke:#000;stroke-width:2.5;fill:#fff}</style>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs>
<text x="40" y="40" class="h" text-anchor="start">(b) MOD-7 counter using the 7493 - logic symbol</text>
<rect class="box" x="500" y="200" width="400" height="120"/>
<text x="700" y="268" class="b" text-anchor="middle">7493</text>
<text x="560" y="222" class="t" text-anchor="middle">Q0</text>
<polyline class="w" points="560,200 560,85" marker-end="url(#ar)"/>
<text x="640" y="222" class="t" text-anchor="middle">Q1</text>
<polyline class="w" points="640,200 640,85" marker-end="url(#ar)"/>
<text x="720" y="222" class="t" text-anchor="middle">Q2</text>
<polyline class="w" points="720,200 720,85" marker-end="url(#ar)"/>
<text x="800" y="222" class="t" text-anchor="middle">Q3</text>
<polyline class="w" points="800,200 800,85" marker-end="url(#ar)"/>
<text x="560" y="70" class="t" text-anchor="middle">Q0 (LSB)</text>
<text x="640" y="70" class="t" text-anchor="middle">Q1</text>
<text x="720" y="70" class="t" text-anchor="middle">Q2 (MSB)</text>
<text x="812" y="70" class="t" text-anchor="start">Q3 (unused)</text>
<polyline class="w" points="300,285 490,285"/>
<circle cx="495" cy="285" r="5" class="box"/>
<polyline class="w" points="500,276 514,285 500,294"/>
<text x="522" y="290" class="t" text-anchor="start">CP0</text>
<text x="292" y="290" class="t" text-anchor="end">Clock</text>
<polyline class="w" points="440,235 490,235"/>
<circle cx="495" cy="235" r="5" class="box"/>
<polyline class="w" points="500,226 514,235 500,244"/>
<text x="522" y="240" class="t" text-anchor="start">CP1</text>
<circle cx="560" cy="185" r="4.5" fill="#000"/>
<polyline class="w" points="560,185 440,185 440,235"/>
<text x="432" y="178" class="s" text-anchor="end">Q0 linked to CP1 (external)</text>
<text x="640" y="312" class="t" text-anchor="middle">MR1</text>
<polyline class="w" points="640,320 640,400"/>
<text x="720" y="312" class="t" text-anchor="middle">MR2</text>
<polyline class="w" points="720,320 720,400"/>
<circle cx="640" cy="400" r="4.5" fill="#000"/>
<circle cx="720" cy="400" r="4.5" fill="#000"/>
<polyline class="w" points="560,120 1020,120 1020,255 1100,255"/>
<circle cx="560" cy="120" r="4.5" fill="#000"/>
<polyline class="w" points="640,145 990,145 990,280 1100,280"/>
<circle cx="640" cy="145" r="4.5" fill="#000"/>
<polyline class="w" points="720,170 960,170 960,305 1100,305"/>
<circle cx="720" cy="170" r="4.5" fill="#000"/>
<path class="box" d="M1100,240 h35 a40,40 0 0 1 0,80 h-35 z"/>
<text x="1130" y="285" class="t" text-anchor="middle">AND</text>
<text x="1140" y="228" class="s" text-anchor="middle">3-input AND</text>
<polyline class="w" points="1175,280 1230,280 1230,400 640,400"/>
<text x="900" y="392" class="t" text-anchor="middle">Reset = Q0 . Q1 . Q2</text>
<text x="40" y="445" class="s" text-anchor="start">Count 000 -> 001 -> 010 -> 011 -> 100 -> 101 -> 110. At 111 (Q2 Q1 Q0 = 111) the AND output goes HIGH, MR1 = MR2 = 1 and the counter clears to 000.</text>
<text x="40" y="466" class="s" text-anchor="start">Q3 never toggles (Q2 never falls before the reset), so the sequence has 7 states: MOD-7.</text>
<g transform="translate(0,520)">
<text x="40" y="0" class="h" text-anchor="start">Internal circuit of the 7493 (as connected for MOD-7)</text>
<rect x="70" y="140" width="920" height="330" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="10 6"/>
<text x="80" y="157" class="s" text-anchor="start">7493 (internal circuit)</text>
<rect class="box" x="200" y="180" width="90" height="100"/>
<text x="222" y="205" class="t" text-anchor="start">J</text>
<text x="222" y="265" class="t" text-anchor="start">K</text>
<polyline class="w" points="182,200 200,200"/>
<text x="177" y="205" class="t" text-anchor="end">1</text>
<polyline class="w" points="182,260 200,260"/>
<text x="177" y="265" class="t" text-anchor="end">1</text>
<circle cx="195" cy="230" r="5" class="box"/>
<polyline class="w" points="200,221 214,230 200,239"/>
<text x="245" y="235" class="b" text-anchor="middle">FF0</text>
<text x="245" y="200" class="s" text-anchor="middle">Q</text>
<text x="254" y="302" class="s" text-anchor="start">CLR</text>
<circle cx="245" cy="285" r="5" class="box"/>
<polyline class="w" points="245,290 245,330"/>
<circle cx="245" cy="330" r="4.5" fill="#000"/>
<polyline class="w" points="245,180 245,42" marker-end="url(#ar)"/>
<text x="245" y="24" class="b" text-anchor="middle">Q0 (LSB)</text>
<rect class="box" x="420" y="180" width="90" height="100"/>
<text x="442" y="205" class="t" text-anchor="start">J</text>
<text x="442" y="265" class="t" text-anchor="start">K</text>
<polyline class="w" points="402,200 420,200"/>
<text x="397" y="205" class="t" text-anchor="end">1</text>
<polyline class="w" points="402,260 420,260"/>
<text x="397" y="265" class="t" text-anchor="end">1</text>
<circle cx="415" cy="230" r="5" class="box"/>
<polyline class="w" points="420,221 434,230 420,239"/>
<text x="465" y="235" class="b" text-anchor="middle">FF1</text>
<text x="465" y="200" class="s" text-anchor="middle">Q</text>
<text x="474" y="302" class="s" text-anchor="start">CLR</text>
<circle cx="465" cy="285" r="5" class="box"/>
<polyline class="w" points="465,290 465,330"/>
<circle cx="465" cy="330" r="4.5" fill="#000"/>
<polyline class="w" points="465,180 465,42" marker-end="url(#ar)"/>
<text x="465" y="24" class="b" text-anchor="middle">Q1</text>
<rect class="box" x="640" y="180" width="90" height="100"/>
<text x="662" y="205" class="t" text-anchor="start">J</text>
<text x="662" y="265" class="t" text-anchor="start">K</text>
<polyline class="w" points="622,200 640,200"/>
<text x="617" y="205" class="t" text-anchor="end">1</text>
<polyline class="w" points="622,260 640,260"/>
<text x="617" y="265" class="t" text-anchor="end">1</text>
<circle cx="635" cy="230" r="5" class="box"/>
<polyline class="w" points="640,221 654,230 640,239"/>
<text x="685" y="235" class="b" text-anchor="middle">FF2</text>
<text x="685" y="200" class="s" text-anchor="middle">Q</text>
<text x="694" y="302" class="s" text-anchor="start">CLR</text>
<circle cx="685" cy="285" r="5" class="box"/>
<polyline class="w" points="685,290 685,330"/>
<circle cx="685" cy="330" r="4.5" fill="#000"/>
<polyline class="w" points="685,180 685,42" marker-end="url(#ar)"/>
<text x="685" y="24" class="b" text-anchor="middle">Q2 (MSB)</text>
<rect class="box" x="860" y="180" width="90" height="100"/>
<text x="882" y="205" class="t" text-anchor="start">J</text>
<text x="882" y="265" class="t" text-anchor="start">K</text>
<polyline class="w" points="842,200 860,200"/>
<text x="837" y="205" class="t" text-anchor="end">1</text>
<polyline class="w" points="842,260 860,260"/>
<text x="837" y="265" class="t" text-anchor="end">1</text>
<circle cx="855" cy="230" r="5" class="box"/>
<polyline class="w" points="860,221 874,230 860,239"/>
<text x="905" y="235" class="b" text-anchor="middle">FF3</text>
<text x="905" y="200" class="s" text-anchor="middle">Q</text>
<text x="914" y="302" class="s" text-anchor="start">CLR</text>
<circle cx="905" cy="285" r="5" class="box"/>
<polyline class="w" points="905,290 905,330"/>
<circle cx="905" cy="330" r="4.5" fill="#000"/>
<polyline class="w" points="905,180 905,42" marker-end="url(#ar)"/>
<text x="905" y="24" class="b" text-anchor="middle">Q3 (unused)</text>
<polyline class="w" points="245,330 905,330"/>
<text x="700" y="350" class="s" text-anchor="start">CLR bus (active LOW)</text>
<polyline class="w" points="70,230 190,230"/>
<circle cx="70" cy="230" r="4.5" fill="#000"/>
<text x="62" y="225" class="t" text-anchor="end">CP0</text>
<polyline class="w" points="340,470 340,230 410,230"/>
<circle cx="340" cy="470" r="5" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="350" y="462" class="t" text-anchor="start">CP1</text>
<circle cx="245" cy="120" r="4.5" fill="#000"/>
<polyline class="r" points="245,120 15,120 15,495 340,495 340,476"/>
<text x="40" y="516" class="s" text-anchor="start">Q0 to CP1 (external link)</text>
<circle cx="465" cy="160" r="4.5" fill="#000"/>
<polyline class="w" points="465,160 600,160 600,230 630,230"/>
<circle cx="685" cy="160" r="4.5" fill="#000"/>
<polyline class="w" points="685,160 820,160 820,230 850,230"/>
<path class="box" d="M520,445 v-35 a40,40 0 0 1 80,0 v35 z"/>
<circle cx="560" cy="365" r="5" class="box"/>
<text x="560" y="425" class="t" text-anchor="middle">NAND</text>
<polyline class="w" points="560,360 560,330"/>
<circle cx="560" cy="330" r="4.5" fill="#000"/>
<polyline class="w" points="540,445 540,465"/>
<polyline class="w" points="540,475 540,510"/>
<circle cx="540" cy="470" r="5" fill="#fff" stroke="#000" stroke-width="2"/>
<polyline class="w" points="580,445 580,465"/>
<polyline class="w" points="580,475 580,510"/>
<circle cx="580" cy="470" r="5" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="532" y="462" class="t" text-anchor="end">MR1</text>
<text x="588" y="462" class="t" text-anchor="start">MR2</text>
<circle cx="580" cy="510" r="4.5" fill="#000"/>
<polyline class="w" points="245,70 1050,70 1050,225 1080,225"/>
<circle cx="245" cy="70" r="4.5" fill="#000"/>
<polyline class="w" points="465,85 1030,85 1030,250 1080,250"/>
<circle cx="465" cy="85" r="4.5" fill="#000"/>
<polyline class="w" points="685,100 1010,100 1010,275 1080,275"/>
<circle cx="685" cy="100" r="4.5" fill="#000"/>
<path class="box" d="M1080,210 h35 a40,40 0 0 1 0,80 h-35 z"/>
<text x="1110" y="255" class="t" text-anchor="middle">AND</text>
<text x="1120" y="198" class="s" text-anchor="middle">external 3-input AND</text>
<polyline class="w" points="1155,250 1210,250 1210,510 540,510"/>
<text x="900" y="502" class="t" text-anchor="middle">Reset = Q0 . Q1 . Q2  (drives MR1 and MR2 together)</text>
<text x="40" y="560" class="s" text-anchor="start">Each flip-flop is a toggle (J = K = 1), negative-edge triggered. FF0 is clocked by CP0; FF1 by CP1; FF2 by Q1; FF3 by Q2.</text>
<text x="40" y="580" class="s" text-anchor="start">CLR = NOT(MR1 . MR2): when both MR inputs are HIGH all four flip-flops are cleared asynchronously.</text>
</g></svg>